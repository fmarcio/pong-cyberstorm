<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Arena Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#07050d" stroke="#3b2959" stroke-width="2.5" />

  <!-- Court Center Net (Dashed Outline) -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#281d38" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Player 1 Solar Amber Paddle (Left Outline) -->
  <rect x="8" y="15" width="6" height="34" rx="3" fill="none" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

  <!-- Player 2 Ultraviolet Paddle (Right Outline) -->
  <rect x="50" y="15" width="6" height="34" rx="3" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

  <!-- Cyberstorm Solar Lightning Bolt (Center Outline) -->
  <polygon points="36,9 23,31 32,31 28,55 42,27 33,27" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

  <!-- Central Energy Core Spark (Center Outline) -->
  <circle cx="32.5" cy="29" r="3" fill="none" stroke="#ffffff" stroke-width="2" />
</svg>
